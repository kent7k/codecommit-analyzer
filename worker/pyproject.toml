[project]
name = "codecommit-analyzer-worker"
version = "0.1.0"
description = "SQS -> clone CodeCommit repo -> Claude on Bedrock -> S3"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "aws-bedrock-token-generator>=1.0",
  "boto3>=1.40",
  "git-remote-codecommit>=1.17",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyzer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
