[project]
name = "codecommit-analyzer-agent"
version = "0.1.0"
description = "AgentCore Runtime front door: enqueue analyses, answer questions about results"
requires-python = ">=3.12"
dependencies = [
  "bedrock-agentcore>=0.1",
  "boto3>=1.40",
  "strands-agents>=1.0",
]

[dependency-groups]
dev = [
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["app.py", "memory.py", "tools.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
